<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="48" height="32" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="29" rx="16" ry="2.5" fill="rgba(0,0,0,0.45)"/>
  <!-- tracks -->
  <rect x="4" y="22" width="40" height="6" rx="2" fill="#121820" stroke="#5c6b7e" stroke-width="0.5"/>
  <rect x="6" y="23" width="3" height="4" fill="#3d4a5a"/>
  <rect x="12" y="23" width="3" height="4" fill="#3d4a5a"/>
  <rect x="33" y="23" width="3" height="4" fill="#3d4a5a"/>
  <rect x="39" y="23" width="3" height="4" fill="#3d4a5a"/>
  <!-- hull -->
  <path d="M6 22 L8 14 L24 10 L40 14 L42 22 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <path d="M8 14 L24 10 L40 14 L24 16 Z" fill="#2a3848"/>
  <!-- railgun barrel -->
  <rect x="20" y="6" width="24" height="3.5" rx="0.5" fill="url(#steelL)" stroke="#5c6b7e" stroke-width="0.4"/>
  <rect x="20" y="7" width="24" height="1" fill="#0a0e14" opacity="0.35"/>
  <rect x="18" y="5" width="6" height="5.5" rx="0.5" fill="#1c2733" stroke="#8a9aac" stroke-width="0.4"/>
  <circle cx="44" cy="7.75" r="1.5" fill="#7eb6c9" filter="url(#softGlow)"/>
  <!-- capacitors -->
  <rect x="12" y="16" width="4" height="4" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.5"/>
  <rect x="13" y="17" width="2" height="2" fill="#7eb6c9" opacity="0.5"/>
  <line x1="10" y1="20" x2="38" y2="20" stroke="#c4a574" stroke-width="0.6" opacity="0.6"/>

</svg>
