<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="20" cy="36" rx="8" ry="2" fill="rgba(0,0,0,0.45)" opacity="0.3"/>
  <!-- satellite body -->
  <rect x="14" y="12" width="12" height="16" rx="1" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <rect x="15" y="13" width="4" height="14" fill="#121820" opacity="0.4"/>
  <!-- solar panels -->
  <path d="M2 16 L14 14 L14 26 L2 24 Z" fill="#1c2733" stroke="#7eb6c9" stroke-width="0.6"/>
  <path d="M38 16 L26 14 L26 26 L38 24 Z" fill="#1c2733" stroke="#7eb6c9" stroke-width="0.6"/>
  <line x1="5" y1="18" x2="12" y2="17" stroke="#7eb6c9" stroke-width="0.3" opacity="0.5"/>
  <line x1="5" y1="22" x2="12" y2="21" stroke="#7eb6c9" stroke-width="0.3" opacity="0.5"/>
  <line x1="28" y1="17" x2="35" y2="18" stroke="#7eb6c9" stroke-width="0.3" opacity="0.5"/>
  <line x1="28" y1="21" x2="35" y2="22" stroke="#7eb6c9" stroke-width="0.3" opacity="0.5"/>
  <!-- emitter -->
  <circle cx="20" cy="10" r="3" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.8"/>
  <circle cx="20" cy="10" r="1.5" fill="url(#coreG)" filter="url(#softGlow)"/>
  <line x1="20" y1="7" x2="20" y2="2" stroke="#7eb6c9" stroke-width="1.5" opacity="0.6"/>
  <circle cx="20" cy="28" r="1.5" fill="#c4a574"/>

</svg>
