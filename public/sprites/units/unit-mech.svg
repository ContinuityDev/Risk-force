<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="45" rx="14" ry="2.5" fill="rgba(0,0,0,0.45)"/>
  <!-- left leg -->
  <path d="M12 28 L8 42 L14 42 L16 30 Z" fill="#1c2733" stroke="#8a9aac" stroke-width="0.6"/>
  <path d="M10 36 L7 42 L13 42" fill="#121820" stroke="#5c6b7e" stroke-width="0.4"/>
  <!-- right leg -->
  <path d="M28 28 L26 42 L34 42 L34 30 Z" fill="#2a3848" stroke="#8a9aac" stroke-width="0.6"/>
  <path d="M28 36 L27 42 L35 42" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.4"/>
  <!-- hip -->
  <ellipse cx="22" cy="28" rx="10" ry="4" fill="#1c2733" stroke="#8a9aac" stroke-width="0.5"/>
  <!-- torso -->
  <path d="M12 12 L12 28 L22 32 L32 28 L32 12 L22 8 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.9"/>
  <path d="M12 12 L22 8 L32 12 L22 18 Z" fill="#2a3848"/>
  <line x1="19.333333333333332" y1="15" x2="19.333333333333332" y2="25" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="24.666666666666664" y1="15" x2="24.666666666666664" y2="25" stroke="#121820" stroke-width="0.5" opacity="0.6"/>

  <!-- cockpit -->
  <ellipse cx="22" cy="16" rx="5" ry="4" fill="#0a0e14" stroke="#7eb6c9" stroke-width="1"/>
  <ellipse cx="22" cy="15" rx="3" ry="2.2" fill="url(#coreG)" opacity="0.85"/>
  <!-- left arm / weapon -->
  <path d="M8 14 L4 24 L8 26 L12 18 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.5"/>
  <rect x="2" y="22" width="8" height="3" rx="0.5" fill="url(#steelL)"/>
  <circle cx="2" cy="23.5" r="1.2" fill="#7eb6c9" filter="url(#softGlow)"/>
  <!-- right arm -->
  <path d="M32 14 L36 22 L32 26 L28 18 Z" fill="#2a3848" stroke="#5c6b7e" stroke-width="0.5"/>
  <!-- shoulder brass -->
  <circle cx="12" cy="12" r="2.5" fill="url(#brassL)"/>
  <circle cx="32" cy="12" r="2.5" fill="url(#brassL)"/>
  <!-- antenna -->
  <line x1="26" y1="8" x2="28" y2="2" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="28" cy="2" r="1.2" fill="#7eb6c9"/>

</svg>
