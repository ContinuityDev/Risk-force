<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 36" width="48" height="36" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="33" rx="12" ry="2" fill="rgba(0,0,0,0.45)"/>
  <!-- legs (4 visible) -->
  <path d="M18 20 L6 8 L4 10 L16 22" fill="none" stroke="#8a9aac" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M18 22 L4 28 L6 30 L18 24" fill="none" stroke="#5c6b7e" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M30 20 L42 8 L44 10 L32 22" fill="none" stroke="#8a9aac" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M30 22 L44 28 L42 30 L30 24" fill="none" stroke="#5c6b7e" stroke-width="1.8" stroke-linecap="round"/>
  <!-- joint bulbs -->
  <circle cx="6" cy="9" r="1.5" fill="#c4a574"/>
  <circle cx="5" cy="29" r="1.5" fill="#c4a574"/>
  <circle cx="42" cy="9" r="1.5" fill="#c4a574"/>
  <circle cx="43" cy="29" r="1.5" fill="#c4a574"/>
  <!-- body -->
  <ellipse cx="24" cy="20" rx="10" ry="7" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <ellipse cx="24" cy="18" rx="6" ry="4" fill="#2a3848"/>
  <!-- sensor cluster -->
  <circle cx="24" cy="17" r="3" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.8"/>
  <circle cx="24" cy="17" r="1.5" fill="url(#coreG)" filter="url(#softGlow)"/>
  <circle cx="20" cy="19" r="1" fill="#7eb6c9" opacity="0.6"/>
  <circle cx="28" cy="19" r="1" fill="#7eb6c9" opacity="0.6"/>

</svg>
