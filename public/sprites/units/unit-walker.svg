<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="45" rx="14" ry="2.5" fill="rgba(0,0,0,0.45)"/>
  <!-- heavy legs -->
  <path d="M10 26 L4 44 L12 44 L16 28 Z" fill="#121820" stroke="#8a9aac" stroke-width="0.7"/>
  <path d="M28 26 L26 44 L38 44 L36 28 Z" fill="#1c2733" stroke="#8a9aac" stroke-width="0.7"/>
  <!-- knee armor -->
  <ellipse cx="10" cy="36" rx="4" ry="3" fill="#2a3848" stroke="#5c6b7e" stroke-width="0.4"/>
  <ellipse cx="32" cy="36" rx="4" ry="3" fill="#2a3848" stroke="#5c6b7e" stroke-width="0.4"/>
  <!-- body -->
  <path d="M10 10 L10 28 L22 34 L36 28 L36 10 L22 4 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="1"/>
  <path d="M10 10 L22 4 L36 10 L22 16 Z" fill="#2a3848"/>
  <line x1="19.333333333333332" y1="13" x2="19.333333333333332" y2="25" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="26.666666666666664" y1="13" x2="26.666666666666664" y2="25" stroke="#121820" stroke-width="0.5" opacity="0.6"/>

  <!-- heavy cockpit -->
  <ellipse cx="22" cy="16" rx="6" ry="5" fill="#0a0e14" stroke="#7eb6c9" stroke-width="1.1"/>
  <ellipse cx="22" cy="15" rx="3.5" ry="2.8" fill="url(#coreG)" opacity="0.8"/>
  <!-- shoulder cannons -->
  <rect x="4" y="10" width="8" height="4" rx="0.5" fill="url(#steelL)"/>
  <rect x="34" y="10" width="8" height="4" rx="0.5" fill="url(#steelL)"/>
  <circle cx="4" cy="12" r="1.5" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="42" cy="12" r="1.5" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="10" cy="10" r="2.5" fill="url(#brassL)"/>
  <circle cx="36" cy="10" r="2.5" fill="url(#brassL)"/>

</svg>
