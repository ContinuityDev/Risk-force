<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 36" width="48" height="36" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="33" rx="14" ry="2.5" fill="rgba(0,0,0,0.45)"/>
  <!-- carriage -->
  <rect x="8" y="24" width="32" height="6" rx="1.5" fill="#121820" stroke="#5c6b7e" stroke-width="0.5"/>
  <circle cx="12" cy="30" r="3.5" fill="#1c2733" stroke="#8a9aac" stroke-width="0.5"/>
  <circle cx="36" cy="30" r="3.5" fill="#1c2733" stroke="#8a9aac" stroke-width="0.5"/>
  <circle cx="12" cy="30" r="1.5" fill="#0a0e14"/>
  <circle cx="36" cy="30" r="1.5" fill="#0a0e14"/>
  <!-- gun body -->
  <path d="M14 24 L14 16 L24 12 L34 16 L34 24 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.7"/>
  <!-- elevated barrel -->
  <g transform="rotate(-35 26 16)">
    <rect x="18" y="12" width="26" height="4.5" rx="1" fill="url(#steelL)" stroke="#5c6b7e" stroke-width="0.4"/>
    <rect x="16" y="11" width="5" height="6.5" rx="0.5" fill="#1c2733" stroke="#8a9aac" stroke-width="0.4"/>
    <circle cx="44" cy="14.25" r="1.3" fill="#7eb6c9" filter="url(#softGlow)"/>
  </g>
  <rect x="18" y="20" width="12" height="2" fill="#c4a574" opacity="0.6"/>

</svg>
