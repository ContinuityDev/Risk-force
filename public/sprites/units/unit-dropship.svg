<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 36" width="56" height="36" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="28" cy="32" rx="18" ry="2.5" fill="rgba(0,0,0,0.45)"/>
  <!-- fuselage -->
  <path d="M4 20 L10 12 L28 8 L48 12 L52 18 L48 24 L28 28 L10 24 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.9"/>
  <path d="M10 12 L28 8 L48 12 L28 16 Z" fill="#2a3848"/>
  <line x1="18.4" y1="15" x2="18.4" y2="23" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="24.8" y1="15" x2="24.8" y2="23" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="31.2" y1="15" x2="31.2" y2="23" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="37.6" y1="15" x2="37.6" y2="23" stroke="#121820" stroke-width="0.5" opacity="0.6"/>

  <!-- cockpit -->
  <path d="M4 20 L8 14 L14 12 L14 22 L8 24 Z" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.7"/>
  <path d="M6 18 L10 15 L12 16 L8 20 Z" fill="#7eb6c9" opacity="0.4"/>
  <!-- wings / thrusters -->
  <path d="M20 22 L16 30 L22 28 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.4"/>
  <path d="M36 22 L40 30 L34 28 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.4"/>
  <ellipse cx="18" cy="28" rx="3" ry="1.5" fill="#7eb6c9" opacity="0.5"/>
  <ellipse cx="38" cy="28" rx="3" ry="1.5" fill="#7eb6c9" opacity="0.5"/>
  <!-- troop bay doors -->
  <rect x="22" y="18" width="12" height="5" rx="0.5" fill="#0a0e14" stroke="#c4a574" stroke-width="0.5"/>
  <line x1="28" y1="18" x2="28" y2="23" stroke="#c4a574" stroke-width="0.4"/>
  <!-- engine glow -->
  <ellipse cx="50" cy="18" rx="3" ry="2.5" fill="#7eb6c9" opacity="0.6" filter="url(#softGlow)"/>

</svg>
