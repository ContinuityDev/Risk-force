<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 28" width="48" height="28" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="25" rx="14" ry="2" fill="rgba(0,0,0,0.45)" opacity="0.35"/>
  <!-- hull -->
  <path d="M4 16 L12 10 L36 10 L44 16 L40 20 L8 20 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.7"/>
  <path d="M12 10 L36 10 L34 14 L14 14 Z" fill="#2a3848"/>
  <!-- foils -->
  <path d="M12 20 L8 26 L16 22 Z" fill="#5c6b7e" stroke="#8a9aac" stroke-width="0.4"/>
  <path d="M36 20 L40 26 L32 22 Z" fill="#5c6b7e" stroke="#8a9aac" stroke-width="0.4"/>
  <!-- cockpit -->
  <ellipse cx="18" cy="12" rx="4" ry="2.5" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.5"/>
  <ellipse cx="18" cy="11.5" rx="2" ry="1.2" fill="#7eb6c9" opacity="0.4"/>
  <!-- missile racks -->
  <rect x="28" y="12" width="10" height="2" fill="#1c2733" stroke="#c4a574" stroke-width="0.3"/>
  <!-- wake glow -->
  <ellipse cx="42" cy="16" rx="3" ry="1.5" fill="#7eb6c9" opacity="0.4"/>

</svg>
