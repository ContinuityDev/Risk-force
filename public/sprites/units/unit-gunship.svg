<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 32" width="52" height="32" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="26" cy="29" rx="14" ry="2" fill="rgba(0,0,0,0.45)"/>
  <!-- fuselage -->
  <path d="M4 16 L12 10 L30 8 L44 12 L48 16 L44 20 L28 24 L10 20 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <path d="M12 10 L30 8 L44 12 L28 14 Z" fill="#2a3848"/>
  <!-- cockpit canopy -->
  <path d="M4 16 L8 11 L16 10 L16 18 L8 20 Z" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.7"/>
  <path d="M6 15 L10 12 L14 12 L10 17 Z" fill="#7eb6c9" opacity="0.35"/>
  <!-- stub wings + hardpoints -->
  <path d="M22 18 L18 26 L28 22 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.4"/>
  <path d="M34 16 L38 24 L32 20 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.4"/>
  <rect x="20" y="22" width="6" height="2" fill="#c4a574" opacity="0.7"/>
  <!-- chin gun -->
  <rect x="10" y="18" width="10" height="1.5" rx="0.3" fill="url(#steelL)"/>
  <circle cx="10" cy="18.75" r="1" fill="#7eb6c9" opacity="0.7"/>
  <!-- engine -->
  <ellipse cx="46" cy="16" rx="3" ry="2.5" fill="#7eb6c9" opacity="0.55" filter="url(#softGlow)"/>
  <rect x="42" y="13" width="5" height="6" rx="1" fill="#1c2733" stroke="#8a9aac" stroke-width="0.4"/>

</svg>
