<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 36" width="48" height="36" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="32" rx="16" ry="3" fill="rgba(0,0,0,0.45)"/>
  <!-- anti-grav glow undercarriage -->
  <ellipse cx="24" cy="28" rx="14" ry="3" fill="rgba(126,182,201,0.35)" filter="url(#softGlow)"/>
  <ellipse cx="24" cy="28" rx="10" ry="2" fill="#7eb6c9" opacity="0.35"/>
  <!-- hull -->
  <path d="M6 22 L10 14 L24 10 L38 14 L42 22 L38 26 L24 28 L10 26 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.9"/>
  <path d="M10 14 L24 10 L38 14 L24 18 Z" fill="#2a3848"/>
  <line x1="18" y1="17" x2="18" y2="23" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="24" y1="17" x2="24" y2="23" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="30" y1="17" x2="30" y2="23" stroke="#121820" stroke-width="0.5" opacity="0.6"/>

  <!-- turret -->
  <ellipse cx="24" cy="16" rx="6" ry="4" fill="#1c2733" stroke="#8a9aac" stroke-width="0.6"/>
  <rect x="22" y="6" width="4" height="10" rx="0.5" fill="url(#steelL)"/>
  <circle cx="24" cy="6" r="1.5" fill="#7eb6c9" filter="url(#softGlow)"/>
  <!-- side thrusters -->
  <ellipse cx="8" cy="22" rx="3" ry="2.5" fill="#121820" stroke="#7eb6c9" stroke-width="0.5"/>
  <ellipse cx="40" cy="22" rx="3" ry="2.5" fill="#121820" stroke="#7eb6c9" stroke-width="0.5"/>
  <circle cx="8" cy="22" r="1" fill="#a8d4e0" opacity="0.7"/>
  <circle cx="40" cy="22" r="1" fill="#a8d4e0" opacity="0.7"/>
  <!-- brass trim -->
  <line x1="12" y1="24" x2="36" y2="24" stroke="#c4a574" stroke-width="0.7" opacity="0.7"/>

</svg>
