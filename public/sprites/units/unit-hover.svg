    <path d="M18 30.799999999999997 L41.6 32 L60.8 30.32" stroke="#1a2218" stroke-width="1.2" opacity="0.35" stroke-linecap="round"/>
  <path d="M28.8 21.2 L51.2 20.72" stroke="#8a96a4" stroke-width="0.4" opacity="0.2"/>
