  <path d="M18 28 L17 36 L20 36 L21 28 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.3"/>
  <!-- body - darker stealth armor -->
  <path d="M10 16 L10 28 L16 30 L22 28 L22 16 L16 14 Z" fill="#121820" stroke="#5c6b7e" stroke-width="0.6"/>
  <path d="M10 16 L16 14 L22 16 L16 19 Z" fill="#1c2733"/>
  <!-- cyber pack -->
  <rect x="20" y="18" width="5" height="8" rx="0.5" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.5"/>
  <rect x="21" y="19" width="3" height="1.5" fill="#7eb6c9" opacity="0.5"/>
  <rect x="21" y="22" width="3" height="1.5" fill="#7eb6c9" opacity="0.4"/>
  <!-- helmet visor -->
  <ellipse cx="16" cy="11" rx="4.5" ry="5" fill="#121820" stroke="#5c6b7e" stroke-width="0.5"/>
  <rect x="13" y="9" width="6" height="2.5" rx="0.5" fill="#7eb6c9" opacity="0.7"/>
  <!-- SMG -->
