<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 28" width="56" height="28" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="28" cy="24" rx="20" ry="2.5" fill="rgba(0,0,0,0.45)" opacity="0.4"/>
  <!-- hull -->
  <ellipse cx="28" cy="16" rx="22" ry="7" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <ellipse cx="28" cy="14" rx="18" ry="4" fill="#2a3848" opacity="0.5"/>
  <!-- bow -->
  <path d="M6 16 L2 16 L8 12 L8 20 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.4"/>
  <!-- sail / conning tower -->
  <path d="M24 10 L24 4 L32 4 L34 10 Z" fill="#1c2733" stroke="#8a9aac" stroke-width="0.6"/>
  <rect x="26" y="2" width="2" height="4" fill="#8a9aac"/>
  <circle cx="27" cy="2" r="1" fill="#7eb6c9"/>
  <!-- torpedo tubes -->
  <circle cx="10" cy="14" r="1.2" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.4"/>
  <circle cx="10" cy="18" r="1.2" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.4"/>
  <!-- prop wash -->
  <ellipse cx="50" cy="16" rx="3" ry="2" fill="#7eb6c9" opacity="0.3"/>
  <line x1="16" y1="20" x2="40" y2="20" stroke="#c4a574" stroke-width="0.5" opacity="0.5"/>

</svg>
