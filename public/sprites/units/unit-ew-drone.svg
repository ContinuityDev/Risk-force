<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 28" width="36" height="28" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="18" cy="25" rx="8" ry="2" fill="rgba(0,0,0,0.45)"/>
  <!-- body -->
  <ellipse cx="18" cy="14" rx="7" ry="5" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.7"/>
  <!-- dish -->
  <ellipse cx="18" cy="10" rx="8" ry="3.5" fill="none" stroke="#7eb6c9" stroke-width="1" opacity="0.7"/>
  <ellipse cx="18" cy="10" rx="5" ry="2" fill="none" stroke="#a8d4e0" stroke-width="0.5" opacity="0.5"/>
  <circle cx="18" cy="10" r="2" fill="url(#coreG)" filter="url(#softGlow)"/>
  <!-- wings -->
  <path d="M8 14 L2 18 L8 18 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.3"/>
  <path d="M28 14 L34 18 L28 18 Z" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.3"/>
  <!-- antenna array -->
  <line x1="14" y1="8" x2="10" y2="2" stroke="#8a9aac" stroke-width="0.8"/>
  <line x1="22" y1="8" x2="26" y2="2" stroke="#8a9aac" stroke-width="0.8"/>
  <circle cx="10" cy="2" r="1" fill="#7eb6c9"/>
  <circle cx="26" cy="2" r="1" fill="#7eb6c9"/>
  <ellipse cx="18" cy="20" rx="2.5" ry="1" fill="#7eb6c9" opacity="0.4"/>

</svg>
