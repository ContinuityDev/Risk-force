<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="44" rx="14" ry="3" fill="url(#padG)"/>
  <ellipse cx="24" cy="44" rx="12.88" ry="2.55" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <ellipse cx="24" cy="40" rx="11" ry="4" fill="#121820" stroke="#5c6b7e" stroke-width="0.6"/>
  <path d="M16 38 L16 26 L24 20 L32 26 L32 38 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.7"/>
  <ellipse cx="24" cy="26" rx="8" ry="3" fill="#2a3848"/>
  <!-- CIWS barrels -->
  <g>
    <rect x="20" y="10" width="2" height="14" rx="0.3" fill="url(#steelL)"/>
    <rect x="23" y="8" width="2" height="16" rx="0.3" fill="url(#steelL)"/>
    <rect x="26" y="10" width="2" height="14" rx="0.3" fill="url(#steelL)"/>
    <circle cx="21" cy="10" r="0.8" fill="#7eb6c9" opacity="0.7"/>
    <circle cx="24" cy="8" r="1" fill="#7eb6c9" filter="url(#softGlow)"/>
    <circle cx="27" cy="10" r="0.8" fill="#7eb6c9" opacity="0.7"/>
  </g>
  <!-- radar dome -->
  <circle cx="24" cy="24" r="3" fill="#1c2733" stroke="#7eb6c9" stroke-width="0.6"/>
  <circle cx="24" cy="24" r="1.2" fill="#a8d4e0" opacity="0.7"/>
  <rect x="18" y="34" width="12" height="2" fill="#c4a574" opacity="0.6"/>

