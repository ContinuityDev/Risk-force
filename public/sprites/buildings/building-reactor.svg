<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="44" rx="20" ry="4.5" fill="url(#padG)"/>
  <ellipse cx="24" cy="44" rx="18.4" ry="3.83" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <!-- base ring -->
  <ellipse cx="24" cy="40" rx="16" ry="5" fill="#121820" stroke="#5c6b7e" stroke-width="0.7"/>
  <ellipse cx="24" cy="39" rx="13" ry="4" fill="#1c2733"/>
  <!-- cylinder body -->
  <path d="M11 38 L11 18 Q11 12 24 12 Q37 12 37 18 L37 38 Q37 42 24 42 Q11 42 11 38 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.9"/>
  <!-- side shading -->
  <path d="M11 18 Q11 12 24 12 L24 42 Q11 42 11 38 Z" fill="#121820" opacity="0.45"/>
  <path d="M37 18 Q37 12 24 12 L24 42 Q37 42 37 38 Z" fill="#2a3848" opacity="0.35"/>
  <!-- horizontal bands -->
  <ellipse cx="24" cy="20" rx="12.5" ry="3.2" fill="none" stroke="#5c6b7e" stroke-width="0.6"/>
  <ellipse cx="24" cy="28" rx="12.5" ry="3.2" fill="none" stroke="#5c6b7e" stroke-width="0.6"/>
  <ellipse cx="24" cy="34" rx="12.5" ry="3" fill="none" stroke="#c4a574" stroke-width="0.7" opacity="0.8"/>
  <!-- top cap -->
  <ellipse cx="24" cy="16" rx="11" ry="4.5" fill="#2a3848" stroke="#8a9aac" stroke-width="0.7"/>
  <ellipse cx="24" cy="15.5" rx="7" ry="2.8" fill="#1c2733"/>
  <!-- pulsing core -->
  <g id="glow">
    <ellipse cx="24" cy="26" rx="6" ry="7" fill="rgba(126,182,201,0.35)"/>
    <ellipse cx="24" cy="26" rx="4" ry="5" fill="url(#coreG)" filter="url(#softGlow)"/>
    <ellipse cx="24" cy="25" rx="2" ry="2.5" fill="#d4eef5" opacity="0.95"/>
  </g>
  <!-- brass coolant pipes -->
  <path d="M8 30 Q6 26 8 22" stroke="#c4a574" stroke-width="1.5" fill="none"/>
  <path d="M40 30 Q42 26 40 22" stroke="#c4a574" stroke-width="1.5" fill="none"/>
  <circle cx="8" cy="22" r="1.5" fill="#e0c9a0"/>
  <circle cx="40" cy="22" r="1.5" fill="#e0c9a0"/>
  <line x1="24" y1="12" x2="24" y2="7" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="24" cy="7" r="1.4" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="24" cy="7" r="0.6" fill="#d4eef5"/>

</svg>
