<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="44" rx="18" ry="3.5" fill="url(#padG)"/>
  <ellipse cx="24" cy="44" rx="16.56" ry="2.98" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <ellipse cx="24" cy="40" rx="15" ry="5" fill="#121820" stroke="#5c6b7e" stroke-width="0.6"/>
  <!-- well head -->
  <path d="M14 38 L14 24 L24 16 L34 24 L34 38 Q34 42 24 42 Q14 42 14 38 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <ellipse cx="24" cy="24" rx="10" ry="4" fill="#2a3848"/>
  <!-- heat vents -->
  <ellipse cx="24" cy="28" rx="5" ry="4" fill="#0a0e14" stroke="#c4a574" stroke-width="1"/>
  <ellipse cx="24" cy="28" rx="3" ry="2.5" fill="#c47850" opacity="0.7"/>
  <ellipse cx="24" cy="27" rx="1.5" ry="1.2" fill="#e0c9a0" opacity="0.8"/>
  <!-- pipes -->
  <path d="M10 30 Q6 26 10 20 L14 20" stroke="#c4a574" stroke-width="2" fill="none"/>
  <path d="M38 30 Q42 26 38 20 L34 20" stroke="#c4a574" stroke-width="2" fill="none"/>
  <!-- steam -->
  <path d="M22 16 Q20 10 22 6" stroke="#5c6b7e" stroke-width="1" opacity="0.3" fill="none"/>
  <path d="M26 16 Q28 10 26 6" stroke="#5c6b7e" stroke-width="1" opacity="0.3" fill="none"/>
  <line x1="24" y1="16" x2="24" y2="13" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="24" cy="13" r="1.4" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="24" cy="13" r="0.6" fill="#d4eef5"/>

</svg>
