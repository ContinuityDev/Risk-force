<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="32" cy="44" rx="28" ry="4" fill="url(#padG)"/>
  <ellipse cx="32" cy="44" rx="25.76" ry="3.4" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <!-- base pad -->
  <path d="M6 42 L6 34 L32 26 L58 34 L58 42 L32 48 Z" fill="#121820" stroke="#5c6b7e" stroke-width="0.7"/>
  <path d="M6 34 L32 26 L58 34 L32 42 Z" fill="#1c2733"/>
  <!-- factory hall -->
  <path d="M10 38 L10 20 L32 12 L54 20 L54 38 L32 46 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.9"/>
  <path d="M10 20 L32 12 L54 20 L32 28 Z" fill="#2a3848"/>
  <path d="M10 20 L10 38 L32 46 L32 28 Z" fill="#121820" opacity="0.5"/>
  <line x1="21.2" y1="23" x2="21.2" y2="37" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="28.4" y1="23" x2="28.4" y2="37" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="35.6" y1="23" x2="35.6" y2="37" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="42.8" y1="23" x2="42.8" y2="37" stroke="#121820" stroke-width="0.5" opacity="0.6"/>

  <!-- roof ridge lights -->
  <circle cx="20" cy="18" r="1" fill="#7eb6c9" opacity="0.8"/>
  <circle cx="32" cy="14" r="1.2" fill="#a8d4e0" filter="url(#softGlow)"/>
  <circle cx="44" cy="18" r="1" fill="#7eb6c9" opacity="0.8"/>
  <!-- assembly bay door -->
  <path d="M24 36 L24 26 L32 22 L40 26 L40 36 L32 40 Z" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.8"/>
  <line x1="32" y1="22" x2="32" y2="40" stroke="#7eb6c9" stroke-width="0.5" opacity="0.5"/>
  <rect x="28" y="28" width="8" height="4" fill="url(#coreG)" opacity="0.7"/>
  <!-- crane arm -->
  <rect x="46" y="8" width="3" height="14" fill="#5c6b7e" stroke="#8a9aac" stroke-width="0.4"/>
  <path d="M47.5 8 L56 14" stroke="#8a9aac" stroke-width="1.5"/>
  <circle cx="56" cy="14" r="1.5" fill="#c4a574"/>
  <!-- brass vents -->
  <rect x="14" y="32" width="6" height="2.5" rx="0.3" fill="url(#brassL)"/>
  <rect x="44" y="32" width="6" height="2.5" rx="0.3" fill="url(#brassL)"/>
  <line x1="32" y1="12" x2="32" y2="6" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="32" cy="6" r="1.4" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="32" cy="6" r="0.6" fill="#d4eef5"/>

</svg>
