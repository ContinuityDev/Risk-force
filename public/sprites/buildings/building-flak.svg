<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="44" rx="16" ry="3.5" fill="url(#padG)"/>
  <ellipse cx="24" cy="44" rx="14.72" ry="2.98" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <!-- AA pad -->
  <ellipse cx="24" cy="40" rx="14" ry="5" fill="#121820" stroke="#5c6b7e" stroke-width="0.7"/>
  <!-- turret body -->
  <path d="M14 38 L14 26 L24 20 L34 26 L34 38 Q34 42 24 42 Q14 42 14 38 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <ellipse cx="24" cy="26" rx="10" ry="4" fill="#2a3848" stroke="#8a9aac" stroke-width="0.5"/>
  <!-- multi-barrel cluster -->
  <g transform="translate(0,-2)">
    <rect x="17" y="8" width="2.5" height="16" rx="0.4" fill="url(#steelL)" stroke="#5c6b7e" stroke-width="0.3"/>
    <rect x="21.5" y="5" width="2.5" height="19" rx="0.4" fill="url(#steelL)" stroke="#8a9aac" stroke-width="0.4"/>
    <rect x="26" y="7" width="2.5" height="17" rx="0.4" fill="url(#steelL)" stroke="#5c6b7e" stroke-width="0.3"/>
    <rect x="30" y="10" width="2" height="14" rx="0.3" fill="#5c6b7e"/>
    <!-- muzzle tips -->
    <circle cx="18.25" cy="8" r="1" fill="#7eb6c9" opacity="0.7"/>
    <circle cx="22.75" cy="5" r="1.2" fill="#7eb6c9" filter="url(#softGlow)"/>
    <circle cx="27.25" cy="7" r="1" fill="#7eb6c9" opacity="0.7"/>
  </g>
  <!-- ammo drums -->
  <ellipse cx="12" cy="32" rx="3" ry="4" fill="#1c2733" stroke="#c4a574" stroke-width="0.6"/>
  <ellipse cx="36" cy="32" rx="3" ry="4" fill="#1c2733" stroke="#c4a574" stroke-width="0.6"/>
  <!-- targeting sensor -->
  <circle cx="24" cy="24" r="2" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.7"/>
  <circle cx="24" cy="24" r="0.8" fill="#a8d4e0"/>

</svg>
