<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="44" rx="15" ry="3.5" fill="url(#padG)"/>
  <ellipse cx="24" cy="44" rx="13.8" ry="2.98" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <ellipse cx="24" cy="40" rx="12" ry="4" fill="#121820" stroke="#5c6b7e" stroke-width="0.6"/>
  <path d="M18 38 L18 20 L24 14 L30 20 L30 38 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <path d="M18 20 L24 14 L30 20 L24 24 Z" fill="#2a3848"/>
  <!-- spire array -->
  <line x1="20" y1="16" x2="16" y2="4" stroke="#8a9aac" stroke-width="1.2"/>
  <line x1="24" y1="14" x2="24" y2="2" stroke="#8a9aac" stroke-width="1.5"/>
  <line x1="28" y1="16" x2="32" y2="4" stroke="#8a9aac" stroke-width="1.2"/>
  <circle cx="16" cy="4" r="1.5" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="24" cy="2" r="2" fill="#a8d4e0" filter="url(#softGlow)"/>
  <circle cx="32" cy="4" r="1.5" fill="#7eb6c9" filter="url(#softGlow)"/>
  <!-- wave arcs -->
  <path d="M10 12 Q24 0 38 12" fill="none" stroke="#7eb6c9" stroke-width="0.6" opacity="0.4"/>
  <path d="M12 16 Q24 6 36 16" fill="none" stroke="#7eb6c9" stroke-width="0.4" opacity="0.3"/>
  <rect x="20" y="30" width="8" height="3" rx="0.5" fill="url(#brassL)"/>

</svg>
