<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="44" rx="20" ry="4" fill="url(#padG)"/>
  <ellipse cx="24" cy="44" rx="18.4" ry="3.4" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <!-- base -->
  <path d="M6 42 L6 32 L24 26 L42 32 L42 42 L24 46 Z" fill="#121820" stroke="#5c6b7e" stroke-width="0.7"/>
  <path d="M6 32 L24 26 L42 32 L24 38 Z" fill="#1c2733"/>
  <!-- main building -->
  <path d="M10 36 L10 22 L24 16 L38 22 L38 36 L24 42 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <path d="M10 22 L24 16 L38 22 L24 28 Z" fill="#2a3848"/>
  <line x1="20" y1="25" x2="20" y2="35" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="28" y1="25" x2="28" y2="35" stroke="#121820" stroke-width="0.5" opacity="0.6"/>

  <!-- smokestack 1 -->
  <rect x="14" y="8" width="5" height="18" rx="0.5" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.6"/>
  <rect x="14.5" y="8" width="1.5" height="18" fill="#121820" opacity="0.5"/>
  <rect x="14" y="7" width="5" height="2" fill="#8a9aac"/>
  <!-- smokestack 2 -->
  <rect x="22" y="5" width="6" height="20" rx="0.5" fill="#2a3848" stroke="#8a9aac" stroke-width="0.6"/>
  <rect x="22.5" y="5" width="2" height="20" fill="#1c2733" opacity="0.4"/>
  <rect x="22" y="4" width="6" height="2.5" fill="url(#steelL)"/>
  <!-- smokestack 3 -->
  <rect x="31" y="10" width="4" height="16" rx="0.4" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.5"/>
  <rect x="31" y="9" width="4" height="1.5" fill="#8a9aac"/>
  <!-- vent paths (subtle) -->
  <path d="M16.5 7 Q14 3 12 1" stroke="#5c6b7e" stroke-width="1" fill="none" opacity="0.35" stroke-linecap="round"/>
  <path d="M25 4 Q23 0 20 -1" stroke="#5c6b7e" stroke-width="1.2" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M33 9 Q32 5 30 3" stroke="#5c6b7e" stroke-width="0.8" fill="none" opacity="0.3" stroke-linecap="round"/>
  <!-- energy conduit -->
  <rect x="20" y="30" width="8" height="3" rx="0.5" fill="#0a0e14" stroke="#7eb6c9" stroke-width="0.7"/>
  <rect x="21" y="30.5" width="6" height="2" fill="#7eb6c9" opacity="0.6"/>
  <!-- brass fittings -->
  <circle cx="12" cy="34" r="1.5" fill="url(#brassL)"/>
  <circle cx="36" cy="34" r="1.5" fill="url(#brassL)"/>

</svg>
