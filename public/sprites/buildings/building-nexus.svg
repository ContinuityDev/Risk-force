<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="32" cy="58" rx="28" ry="6" fill="url(#padG)"/>
  <ellipse cx="32" cy="58" rx="25.76" ry="5.1" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <!-- base footprint 2x2 -->
  <path d="M10 52 L10 36 L32 28 L54 36 L54 52 L32 58 Z" fill="#121820" stroke="#5c6b7e" stroke-width="0.8"/>
  <path d="M10 36 L32 28 L54 36 L32 44 Z" fill="#1c2733"/>
  <path d="M10 36 L10 52 L32 58 L32 44 Z" fill="#121820"/>
  <path d="M54 36 L54 52 L32 58 L32 44 Z" fill="#2a3848"/>
  <!-- upper deck -->
  <path d="M16 40 L16 26 L32 18 L48 26 L48 40 L32 48 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.9"/>
  <path d="M16 26 L32 18 L48 26 L32 34 Z" fill="#2a3848"/>
  <path d="M16 26 L16 40 L32 48 L32 34 Z" fill="#1c2733"/>
  <path d="M48 26 L48 40 L32 48 L32 34 Z" fill="#3d4a5a"/>
  <line x1="25" y1="29" x2="25" y2="41" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="32" y1="29" x2="32" y2="41" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="39" y1="29" x2="39" y2="41" stroke="#121820" stroke-width="0.5" opacity="0.6"/>

  <!-- central tower -->
  <path d="M24 30 L24 16 L32 12 L40 16 L40 30 L32 34 Z" fill="#1c2733" stroke="#8a9aac" stroke-width="0.7"/>
  <path d="M24 16 L32 12 L40 16 L32 20 Z" fill="#2a3848"/>
  <!-- holo core -->
  <ellipse cx="32" cy="24" rx="7" ry="6" fill="#0a0e14" stroke="#7eb6c9" stroke-width="1.2"/>
  <ellipse cx="32" cy="24" rx="4.5" ry="3.8" fill="url(#coreG)" filter="url(#softGlow)" opacity="0.95"/>
  <ellipse cx="32" cy="23" rx="2" ry="1.5" fill="#d4eef5" opacity="0.9"/>
  <!-- brass vents -->
  <rect x="18" y="42" width="5" height="3" rx="0.5" fill="url(#brassL)"/>
  <rect x="41" y="42" width="5" height="3" rx="0.5" fill="url(#brassL)"/>
  <rect x="28" y="46" width="8" height="2" rx="0.3" fill="#c4a574" opacity="0.7"/>
  <line x1="32" y1="12" x2="32" y2="5" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="32" cy="5" r="1.4" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="32" cy="5" r="0.6" fill="#d4eef5"/>
  <line x1="22" y1="18" x2="22" y2="13" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="22" cy="13" r="1.4" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="22" cy="13" r="0.6" fill="#d4eef5"/>
  <line x1="42" y1="18" x2="42" y2="13" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="42" cy="13" r="1.4" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="42" cy="13" r="0.6" fill="#d4eef5"/>
  <!-- corner lights -->
  <circle cx="14" cy="48" r="1.2" fill="#7eb6c9" opacity="0.8"/>
  <circle cx="50" cy="48" r="1.2" fill="#7eb6c9" opacity="0.8"/>

</svg>
