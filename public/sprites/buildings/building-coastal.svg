<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="32" cy="44" rx="26" ry="3.5" fill="url(#padG)"/>
  <ellipse cx="32" cy="44" rx="23.92" ry="2.98" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <path d="M8 42 L8 32 L32 24 L56 32 L56 42 L32 48 Z" fill="#121820" stroke="#5c6b7e" stroke-width="0.8"/>
  <path d="M8 32 L32 24 L56 32 L32 40 Z" fill="#1c2733"/>
  <!-- bunker -->
  <path d="M14 38 L14 24 L32 14 L50 24 L50 38 L32 46 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.9"/>
  <path d="M14 24 L32 14 L50 24 L32 34 Z" fill="#2a3848"/>
  <!-- coastal gun -->
  <g transform="rotate(-12 38 22)">
    <rect x="28" y="18" width="28" height="5" rx="1" fill="url(#steelL)" stroke="#5c6b7e" stroke-width="0.5"/>
    <rect x="26" y="17" width="7" height="7" rx="0.6" fill="#1c2733" stroke="#8a9aac" stroke-width="0.5"/>
    <circle cx="55" cy="20.5" r="2" fill="#7eb6c9" filter="url(#softGlow)"/>
  </g>
  <rect x="16" y="34" width="7" height="5" fill="#3d4a5a" stroke="#c4a574" stroke-width="0.5"/>
  <rect x="42" y="34" width="7" height="5" fill="#3d4a5a" stroke="#c4a574" stroke-width="0.5"/>
  <line x1="20" y1="22" x2="20" y2="17" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="20" cy="17" r="1.4" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="20" cy="17" r="0.6" fill="#d4eef5"/>

