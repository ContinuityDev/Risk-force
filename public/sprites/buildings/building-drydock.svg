  <rect x="20" y="38" width="24" height="8" rx="1.5" fill="#1c2733" stroke="#5c6b7e" stroke-width="0.5"/>
  <rect x="28" y="40" width="8" height="3" fill="#7eb6c9" opacity="0.5"/>
