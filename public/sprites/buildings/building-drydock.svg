  <path d="M12 52 L12 44 L32 36 L52 44 L52 52 L32 58 Z" fill="#0d1520" stroke="#7eb6c9" stroke-width="0.5" opacity="0.85"/>
  <!-- gantries -->
  <rect x="8" y="16" width="5" height="36" fill="#1c2733" stroke="#8a9aac" stroke-width="0.6"/>
  <rect x="51" y="16" width="5" height="36" fill="#1c2733" stroke="#8a9aac" stroke-width="0.6"/>
  <rect x="8.5" y="16" width="1.5" height="36" fill="#121820" opacity="0.5"/>
  <rect x="51.5" y="16" width="1.5" height="36" fill="#121820" opacity="0.5"/>
  <!-- crane beam -->
  <rect x="8" y="14" width="48" height="4" fill="url(#steelL)" stroke="#5c6b7e" stroke-width="0.5"/>
  <rect x="28" y="8" width="4" height="10" fill="#5c6b7e"/>
  <circle cx="30" cy="8" r="2" fill="#c4a574"/>
