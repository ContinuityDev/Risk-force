<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="44" rx="16" ry="3.5" fill="url(#padG)"/>
  <ellipse cx="24" cy="44" rx="14.72" ry="2.98" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <!-- hexagonal pad -->
  <path d="M24 40 L12 36 L12 28 L24 24 L36 28 L36 36 Z" fill="#121820" stroke="#5c6b7e" stroke-width="0.7"/>
  <!-- pylon shaft -->
  <path d="M20 36 L20 16 L24 12 L28 16 L28 36 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <path d="M20 16 L24 12 L28 16 L24 20 Z" fill="#2a3848"/>
  <!-- hex rings on shaft -->
  <path d="M21 22 L24 20.5 L27 22 L24 23.5 Z" fill="none" stroke="#7eb6c9" stroke-width="0.6" opacity="0.7"/>
  <path d="M21 28 L24 26.5 L27 28 L24 29.5 Z" fill="none" stroke="#c4a574" stroke-width="0.6" opacity="0.8"/>
  <!-- emitter head -->
  <path d="M18 16 L24 8 L30 16 L24 18 Z" fill="#1c2733" stroke="#8a9aac" stroke-width="0.7"/>
  <circle cx="24" cy="13" r="3" fill="#0a0e14" stroke="#7eb6c9" stroke-width="1"/>
  <circle cx="24" cy="13" r="1.5" fill="url(#coreG)" filter="url(#softGlow)"/>
  <!-- translucent shield arc -->
  <path d="M8 28 Q8 8 24 4 Q40 8 40 28" fill="none" stroke="#7eb6c9" stroke-width="1.5" opacity="0.45"/>
  <path d="M10 30 Q10 10 24 6 Q38 10 38 30" fill="rgba(126,182,201,0.35)" stroke="#a8d4e0" stroke-width="0.8" opacity="0.35"/>
  <path d="M14 32 Q14 14 24 10 Q34 14 34 32" fill="none" stroke="#a8d4e0" stroke-width="0.5" opacity="0.3"/>
  <!-- brass base fittings -->
  <circle cx="14" cy="38" r="1.5" fill="url(#brassL)"/>
  <circle cx="34" cy="38" r="1.5" fill="url(#brassL)"/>

</svg>
