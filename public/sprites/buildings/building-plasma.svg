<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <radialGradient id="padG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2733" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e14" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="coreG" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4eef5"/>
      <stop offset="45%" stop-color="#7eb6c9"/>
      <stop offset="100%" stop-color="#1a4050" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="hullL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3848"/>
      <stop offset="50%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="40%" stop-color="#8a9aac"/>
      <stop offset="100%" stop-color="#5c6b7e"/>
    </linearGradient>
    <linearGradient id="brassL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0c9a0"/>
      <stop offset="100%" stop-color="#8a7350"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
  </defs>

  <ellipse cx="24" cy="44" rx="18" ry="3.5" fill="url(#padG)"/>
  <ellipse cx="24" cy="44" rx="16.56" ry="2.98" fill="none" stroke="#3d4a5a" stroke-width="0.6" opacity="0.5"/>
  <!-- bunker base -->
  <path d="M8 42 L8 30 L24 22 L40 30 L40 42 L24 46 Z" fill="#121820" stroke="#5c6b7e" stroke-width="0.8"/>
  <path d="M8 30 L24 22 L40 30 L24 38 Z" fill="#1c2733"/>
  <!-- sloped armor -->
  <path d="M12 38 L12 26 L24 18 L36 26 L36 38 L24 44 Z" fill="url(#hullL)" stroke="#8a9aac" stroke-width="0.8"/>
  <path d="M12 26 L24 18 L36 26 L24 34 Z" fill="#2a3848"/>
  <line x1="20.666666666666668" y1="29" x2="20.666666666666668" y2="37" stroke="#121820" stroke-width="0.5" opacity="0.6"/>
  <line x1="27.333333333333336" y1="29" x2="27.333333333333336" y2="37" stroke="#121820" stroke-width="0.5" opacity="0.6"/>

  <!-- plasma aperture -->
  <ellipse cx="24" cy="28" rx="7" ry="5" fill="#0a0e14" stroke="#7eb6c9" stroke-width="1.2"/>
  <ellipse cx="24" cy="28" rx="4.5" ry="3.2" fill="url(#coreG)" filter="url(#softGlow)"/>
  <ellipse cx="24" cy="27" rx="2" ry="1.4" fill="#d4eef5" opacity="0.95"/>
  <!-- aperture ring -->
  <ellipse cx="24" cy="28" rx="7" ry="5" fill="none" stroke="#c4a574" stroke-width="0.5" opacity="0.6" stroke-dasharray="2 1.5"/>
  <!-- armor plates -->
  <path d="M10 34 L14 28 L14 36 Z" fill="#3d4a5a" opacity="0.6"/>
  <path d="M38 34 L34 28 L34 36 Z" fill="#3d4a5a" opacity="0.6"/>
  <!-- brass bolts -->
  <circle cx="14" cy="36" r="1" fill="#c4a574"/>
  <circle cx="34" cy="36" r="1" fill="#c4a574"/>
  <line x1="24" y1="18" x2="24" y2="14" stroke="#8a9aac" stroke-width="1"/>
  <circle cx="24" cy="14" r="1.4" fill="#7eb6c9" filter="url(#softGlow)"/>
  <circle cx="24" cy="14" r="0.6" fill="#d4eef5"/>

</svg>
